name: Tests

on:
  push:
    branches:
      - master
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: autoconf_test
          POSTGRES_USER: autoconf
          POSTGRES_PASSWORD: autoconf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoconf -d autoconf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      fail-fast: true
      matrix:
        php: [8.2, 8.3, 8.4]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Check code formatting
        if: matrix.php == '8.2'
        run: vendor/bin/pint --test

      - name: Analyze OpenAPI documentation
        if: matrix.php == '8.2'
        run: php artisan scramble:analyze

      - name: Execute tests
        run: php artisan test
