name: API CI

on:
  push:
    branches:
      - master
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: autoconf
          POSTGRES_USER: autoconf
          POSTGRES_PASSWORD: autoconf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoconf -d autoconf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Create validation environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Check code formatting
        run: vendor/bin/pint --test

      - name: Check architecture dependencies
        run: composer architecture

      - name: Validate OpenAPI documentation
        run: php artisan scramble:analyze

  tests:
    name: PHPUnit tests · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: autoconf_test
          POSTGRES_USER: autoconf
          POSTGRES_PASSWORD: autoconf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoconf -d autoconf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      fail-fast: true
      matrix:
        php: [8.2, 8.3, 8.4]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Create test environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run PHPUnit feature and unit test suites
        run: php artisan test
