services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-autoconf}
      POSTGRES_USER: ${DB_USERNAME:-autoconf}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-autoconf}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-autoconf} -d ${DB_DATABASE:-autoconf}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
